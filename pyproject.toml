[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-trader"
version = "0.1.0"
description = "Autonomous multi-market algorithmic trading system"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "structlog>=25.4,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]

[tool.setuptools]
packages = [
    "apps",
    "apps.engine",
    "apps.api",
    "apps.dashboard",
    "packages",
    "packages.core",
    "packages.market_data",
    "packages.strategies",
    "packages.risk",
    "packages.execution",
    "packages.portfolio",
    "packages.backtesting",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true